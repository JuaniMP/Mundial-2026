name: CI

on:
  push:
    branches: [main, dev-frontend]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: backend · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & test (Maven)
        working-directory: backend
        run: mvn --batch-mode verify -Dspring.datasource.url=jdbc:h2:mem:testdb -Dspring.datasource.driver-class-name=com.h2database.Driver -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    name: frontend · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 'frontend/world-cup-2026/package-lock.json'

      - name: Install dependencies
        working-directory: frontend/world-cup-2026
        run: npm ci

      - name: Lint
        working-directory: frontend/world-cup-2026
        run: npm run lint

      - name: Typecheck
        working-directory: frontend/world-cup-2026
        run: npm run typecheck

      - name: Build
        working-directory: frontend/world-cup-2026
        run: npm run build

  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 'frontend/world-cup-2026/package-lock.json'
      - name: Install dependencies
        working-directory: frontend/world-cup-2026
        run: npm ci
      - name: Check formatting
        run: npx prettier --check "frontend/world-cup-2026/src/**/*.{ts,tsx,js,jsx,json,md,css,html}"
