spring.application.name=mundial-2026-hub
server.port=8082
server.servlet.context-path=/

# ============== Datasource ==============
# Producción: define DB_URL, DB_USER y DB_PASSWORD como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mundial_2026_hub?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ============== JPA / Hibernate ==============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Fechas en JSON como texto ISO-8601 (antes estaba en application.yml)
spring.jackson.serialization.write-dates-as-timestamps=false
# pre-init.sql borra tablas con datos de usuarios (entradas, agenda, notificaciones…).
# Antes se ejecutaba en CADA arranque y vaciaba esas tablas; ahora es una
# reparación manual: SQL_INIT_MODE=always solo si necesitas recrearlas.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:pre-init.sql
spring.sql.init.continue-on-error=true

# ============== JWT (secret BASE64-encoded, mínimo 256 bits) ==============
# Para generar uno propio: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# ============== CORS (frontend Vite) ==============
mundial26.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:4173}

# ============== Actuator ==============
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ============== Logging (con correlation ID) ==============
logging.level.root=INFO
logging.level.co.edu.unbosque=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%X{correlationId:-}] %logger{36} - %msg%n

# ============== Email (Gmail SMTP) ==============
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============== Football Data API ==============
footballdata.api.key=${FOOTBALL_DATA_KEY:}
footballdata.api.base-url=https://api.football-data.org/v4
footballdata.competition=WC
footballdata.season=2026

# ============== API-Football (RapidAPI) — Eliminatorias ==============
# Free tier: 100 req/day. Sign up at https://www.api-football.com/
apifootball.api.key=${APIFOOTBALL_KEY:}
apifootball.api.host=${APIFOOTBALL_HOST:v3.football.api-sports.io}
apifootball.api.base-url=${APIFOOTBALL_BASE_URL:https://v3.football.api-sports.io}

# Cache (Caffeine) - 5 min TTL para respetar rate limits
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# ============== OpenTripMap API (gratuito) ==============
# Dashboard: https://dev.opentripmap.org/account/settings
opentripmap.api.key=${OPENTRIPMAP_KEY:}

# ============== Overpass API (OpenStreetMap — fallback sin key) ==============
overpass.api.url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}

# ============== Datos de demostración ==============
# true crea ~80 cuentas ficticias con contraseñas conocidas: solo en desarrollo.
mundial26.seed.demo-data=${SEED_DEMO_DATA:false}

# ============== Admin inicial ==============
# Si ADMIN_PASSWORD está vacío no se crea el administrador por defecto.
mundial26.admin.email=${ADMIN_EMAIL:admin@mundial2026.com}
mundial26.admin.password=${ADMIN_PASSWORD:}

# ============== Firebase (FCM Push Notifications) ==============
# Descarga el service account JSON desde Firebase Console → Configuración del proyecto → Cuentas de servicio
# Pega el JSON como variable de entorno o apunta al archivo
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-file=${FIREBASE_SERVICE_ACCOUNT_FILE:}

# ============== Stripe (Sandbox) ==============
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_REEMPLAZA_CON_TU_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_REEMPLAZA_CON_TU_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_test_REEMPLAZA_CON_TU_SECRET}


# ============== Springdoc / Swagger ==============
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
